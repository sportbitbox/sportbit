name: De Box automatisch inschrijven

on:
  schedule:

    # Maandag WOD 07:00
    # Inschrijving opent zaterdag 07:00 NL
    # Zomertijd + wintertijd
    - cron: "50 4 * * 6"
    - cron: "50 5 * * 6"

    # Dinsdag Power 06:00
    # Inschrijving opent zondag 06:00 NL
    - cron: "50 3 * * 0"
    - cron: "50 4 * * 0"

    # Woensdag WOD 06:00
    # Inschrijving opent maandag 06:00 NL
    - cron: "50 3 * * 1"
    - cron: "50 4 * * 1"

    # Donderdag Power 07:00
    # Inschrijving opent dinsdag 07:00 NL
    - cron: "50 4 * * 2"
    - cron: "50 5 * * 2"

    # Zaterdag Power + Buddy Workout 09:15
    # Inschrijving opent donderdag 09:15 NL
    - cron: "5 7 * * 4"
    - cron: "5 8 * * 4"

  workflow_dispatch:

concurrency:
  group: sportbit-auto-signup
  cancel-in-progress: false

jobs:
  signup:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Benodigdheden installeren
        run: pip install requests

      - name: Python-code controleren
        run: python -m py_compile autosignup.py

      - name: Automatisch inschrijven
        env:
          SPORTBIT_USERNAME: ${{ secrets.SPORTBIT_USERNAME }}
          SPORTBIT_PASSWORD: ${{ secrets.SPORTBIT_PASSWORD }}
        run: python autosignup.py --live --days 7 --max-signups 6
